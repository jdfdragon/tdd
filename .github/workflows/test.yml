name: Run Unit and Function Tests

on:
    push:
        branches: 
            - '*'
    pull_request:
        branches: [ main ]

jobs:
    run_styleCheck:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v7
        - uses: mamba-org/setup-micromamba@v3
          with:
            environment-file: environment.yml
            init-shell: bash
        - run: pycodestyle $(git ls-files "*.py")
          shell: bash -l {0}
    run_fire_test:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v7
        - uses: mamba-org/setup-micromamba@v3
          with:
            environment-file: environment.yml
            init-shell: bash
        - run: |
            python test/unit/test_fire_gdp.py
          shell: bash -l {0}
    run_scatter_test:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v7
        - uses: mamba-org/setup-micromamba@v3
          with:
            environment-file: environment.yml
            init-shell: bash
        - run: |
            python test/unit/test_scatter.py
          shell: bash -l {0}
    run_function_test:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v7
        - uses: mamba-org/setup-micromamba@v3
          with:
            environment-file: environment.yml
            init-shell: bash
        - run: |
            bash test/func/test_fire_gdp.sh
          shell: bash -l {0}

